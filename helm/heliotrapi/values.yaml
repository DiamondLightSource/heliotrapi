replicaCount: 1

image:
  repository: ghcr.io/diamondlightsource/heliotrapi
  pullPolicy: Always
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP
  port: 8000

# Name of the Secret holding the config.auth credentials (keys: username, password).
# Create it from a SealedSecret applied with kubectl, see README "Auth credentials".
authSecretName: heliotrapi-auth

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources:
  limits:
    cpu: 2
    memory: 12Gi
    ephemeral-storage: 4Gi
  requests:
    cpu: 1
    memory: 4Gi
    ephemeral-storage: 4Gi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 15
  failureThreshold: 3
  timeoutSeconds: 5
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 30
  failureThreshold: 3
  timeoutSeconds: 5
startupProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 9
  timeoutSeconds: 5


config:
  server:
    host: "0.0.0.0"
    port: 8000
    suppress_polling_logs: false
  auth: # HTTP Basic auth required to submit analyses and read results
    enabled: true
    # username and password come from the Secret named in authSecretName, never put them here
  queue:
    workers: 4
  results:
    ttl_seconds: 3600
    db_path: /data/results.db # on the PVC, keep in sync with persistence.mountPath
  cleanup:
    interval_seconds: 300
  plugins:
    paths:
      - ./plugins
    github_repos: [] # Https GitHub repos with analysis code (ending with .git), each configured separately
    # - url: https://github.com/DiamondLightSource/xrpd-toolbox.git
    #   register_all: false # read every file in this repo and register every public function
    #   include: # dotted paths relative to the repo's src; only these are read when register_all is false
    #     - xrpd_toolbox.i15_1.attenuation
    message_functions: # dotted path (relative to a repo's src) of the one function to run for each STOMP message
      start: null
      stop: null
      nexus_started: null
      nexus_updated: null
      nexus_finished: null
  rabbitmq:
    enabled: true
    host: "ixx-rabbitmq-daq.diamond.ac.uk"
    username: guest
    password: guest
    port: 61613
    destinations:
      - "/topic/public.worker.event" #bluesky scans
      - "/topic/gda.messages.scan" # gda scans
      - "/topic/gda.messages.processing" # dawn stuff
      - "/topic/public.analysis.trigger" # custom topic for triggering analyses from other services
  alerts:
    slack_webhook_url: "" # Webhook URL for sending alerts to Slack, leave empty to disable
  uvicorn:
    workers: 1
  logging:
    graylog:
      enabled: false
      url: ""
      level: "INFO"
    stream:
      enabled: true
      level: "DEBUG"

persistence:
  enabled: true
  existingClaim: "" # use an existing PVC instead of creating one
  storageClass: "" # empty uses the cluster default
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /data
  annotations:
    helm.sh/resource-policy: keep # don't delete the PVC on helm uninstall

volumeMounts: []
volumes: []
nodeSelector: {}
tolerations: []
