replicaCount: 1

image:
  repository: ghcr.io/diamondlightsource/heliotrapi
  pullPolicy: Always
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources:
  limits:
    cpu: 2
    memory: 12Gi
    ephemeral-storage: 4Gi
  requests:
    cpu: 1
    memory: 4Gi
    ephemeral-storage: 4Gi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 15
  failureThreshold: 3
  timeoutSeconds: 5
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 30
  failureThreshold: 3
  timeoutSeconds: 5
startupProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 9
  timeoutSeconds: 5


config:
  server:
    host: "0.0.0.0"
    port: 8000
    suppress_polling_logs: false
  queue:
    workers: 4
  results:
    ttl_seconds: 3600
  redis:
    # localhost: heliotrapi starts its own redis-server (see
    # redis_service.py) and persists it to data_dir below, which is backed
    # by the PVC configured under `persistence` - survives pod restarts.
    # Point this at a separately managed Redis instead if you have one.
    host: "localhost"
    port: 6379
    db: 0
    key_prefix: "heliotrapi"
    data_dir: "/data/redis"
  plugins:
    paths:
      - ./plugins
    github_repos: []
    register_all: True # whether to register all analyses found in plugins or only those decorated
  rabbitmq:
    enabled: true
    host: "ixx-rabbitmq-daq.diamond.ac.uk"
    username: guest
    password: guest
    port: 61613
    destinations:
      - "/topic/public.worker.event" #bluesky scans
      - "/topic/gda.messages.scan" # gda scans
      - "/topic/gda.messages.processing" # dawn stuff
      - "/topic/public.analysis.trigger" # custom topic for triggering analyses from other services
  alerts:
    slack_webhook_url: "" # Webhook URL for sending alerts to Slack, leave empty to disable
  uvicorn:
    workers: 1
  logging:
    graylog:
      enabled: false
      url: ""
      level: "INFO"
    stream:
      enabled: true
      level: "DEBUG"

volumeMounts: []
volumes: []
nodeSelector: {}
tolerations: []

# Backs config.redis.data_dir (the embedded redis-server's storage) with a
# PVC, so queue/results state survives a pod restart. Only meaningful while
# replicaCount is 1 and config.redis.host is "localhost" - a shared/external
# Redis is required instead if this is ever scaled to multiple replicas.
persistence:
  enabled: true
  size: 1Gi
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
