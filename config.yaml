server:
  host: "localhost"
  port: 8000
  suppress_polling_logs: true

queue:
  workers: 4 # concurrent async consumer loops per OS process

results:
  ttl_seconds: 3600 #time to live of results before deletion (Redis key TTL)

redis:
  host: "localhost"
  port: 6379
  db: 0
  key_prefix: "heliotrapi"
  data_dir: "./data/redis" # where the auto-started redis-server persists its data

uvicorn:
  workers: 1 # OS-level Gunicorn worker processes; >1 launches Gunicorn+preload

plugins:
  paths:
    - ./plugins # local folder for plugins
  github_repos: # list of Https GitHub repos with analysis code (ending with .git)
    - https://github.com/DiamondLightSource/xrpd-toolbox.git
  register_all: True # whether to register all analyses found in plugins or only those decorated
rabbitmq:
  enabled: True
  host: "i15-1-rabbitmq-daq.diamond.ac.uk"
  username: "guest"
  password: "guest"
  port: 61613
  destinations:
    - "/topic/public.worker.event" #bluesky scans
    - "/topic/gda.messages.scan" # gda scans
    - "/topic/gda.messages.processing" # dawn stuff
    - "/topic/public.analysis.trigger" # custom topic for triggering analyses from other services

alerts:
  slack_webhook_url: "" # Webhook URL for sending alerts to Slack, leave empty to disable
