server:
  host: "localhost"
  port: 8000
  suppress_polling_logs: true

auth: # HTTP Basic auth required to submit analyses and read results
  enabled: true
  # credentials default to admin / password for local development
  # set HELIOTRAPI_USERNAME and HELIOTRAPI_PASSWORD env vars to change them - don't put them here

queue:
  workers: 4

results:
  ttl_seconds: 3600 #time to live of results before deletion
  db_path: results.db # sqlite file the results are stored in

cleanup:
  interval_seconds: 300 #frequency of checking for deletable results

plugins:
  paths:
    - ./plugins # local folder for plugins
  github_repos: # Https GitHub repos with analysis code (ending with .git), each configured separately
    - url: https://github.com/DiamondLightSource/xrpd-toolbox.git
      register_all: False # read every file in this repo and register every public function
      include: # dotted paths relative to the repo's src; only these are read when register_all is False
        - xrpd_toolbox.i15_1.attenuation # whole module
        # - xrpd_toolbox.i15_1 # whole package
        # - xrpd_toolbox.i15_1.attenuation.my_func # single function
  message_functions: # dotted path (relative to a repo's src) of the one function to run for each STOMP message
    start: null # called with StartMessage fields as kwargs
    stop: null # called with StopMessage fields as kwargs
    nexus_started: null # called with NexusMessage fields as kwargs
    nexus_updated: null # called with NexusMessage fields as kwargs
    nexus_finished: null # called with NexusMessage fields as kwargs
rabbitmq:
  enabled: True
  host: "i15-1-rabbitmq-daq.diamond.ac.uk"
  username: "guest"
  password: "guest"
  port: 61613
  destinations:
    - "/topic/public.worker.event" #bluesky scans
    - "/topic/gda.messages.scan" # gda scans
    - "/topic/gda.messages.processing" # dawn stuff
    - "/topic/public.analysis.trigger" # custom topic for triggering analyses from other services

alerts:
  slack_webhook_url: "" # Webhook URL for sending alerts to Slack, leave empty to disable
