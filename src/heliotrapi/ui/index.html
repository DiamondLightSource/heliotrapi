<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeliotrAPI Analysis</title>
    <link rel="stylesheet" href="/ui/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>🔬 HeliotrAPI Analysis</h1>
            <p>
                Run analysis jobs and track results in real-time -
                <a href="https://github.com/DiamondLightSource/heliotrapi">
                    https://github.com/DiamondLightSource/heliotrapi
                </a>
            </p>
        </header>

        <div id="messages"></div>

        <div class="main-content">
            <!-- Left Column: Analyses Selection -->
            <div class="card">
                <h2>Available Analyses</h2>
                <div class="form-group">
                    <input id="analysis-search" class="search-input"
                        placeholder="Search analyses by name or description..." />
                </div>
                <div id="analyses-list" class="analyses-list">
                    <div class="no-results">Loading analyses...</div>
                </div>
            </div>

            <!-- Right Column: Input Form -->
            <div class="card">
                <h2>Analysis Parameters</h2>
                <div id="dynamic-inputs" class="dynamic-inputs">
                    <div class="info-message">Select an analysis from the left to view parameters</div>
                </div>
                <button id="submit-btn" class="btn-primary">Submit Analysis</button>
                <button id="clear-btn" class="btn-secondary">Clear History</button>
            </div>
        </div>

        <!-- Results Section -->
        <div class="card full-width">
            <h2>Results & History</h2>
            <div id="results-container" class="scrollable">
                <div class="no-results">No analysis results yet</div>
            </div>
        </div>
    </div>

    <script src="/ui/app.js"></script>
    <div id="tooltip" class="tooltip"></div>
</body>

</html>
